name: Publicar edición

# Puente entre la tarea programada de Claude y la base.
#
# La tarea investiga las noticias (gratis, con búsqueda web) y al terminar dispara este
# workflow pasándole la edición ya armada. Acá se valida con el mismo esquema del agente
# y se guarda en Supabase. La clave de servicio vive en los secretos de este repositorio
# y nunca en el texto de la tarea.
#
# A mano:  gh workflow run "Publicar edición" -f edicion="$(cat edicion.json)"
on:
  workflow_dispatch:
    inputs:
      edicion:
        description: "La edición del día, en JSON"
        required: true
        type: string

concurrency:
  group: publicar-edicion
  cancel-in-progress: false

jobs:
  publicar:
    name: Validar y guardar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci --omit=dev
      - name: Validar y guardar la edición
        run: node agente/publicar.mjs
        env:
          EDICION: ${{ inputs.edicion }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
